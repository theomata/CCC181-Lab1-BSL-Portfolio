<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Theo Mata Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0f0f14;
      color: #e4e0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background-color: #161622;
      border: 1px solid #28283c;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ff8f33;
      background: rgba(255, 143, 51, 0.12);
      border: 1px solid rgba(255, 143, 51, 0.3);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #cad5e7;
      margin-bottom: 1rem;
    }
    p {
      color: #9488b0;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #ff8f33;
      color: #0f0f14;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: background-color 0.2s, transform 0.15s;
    }
    .btn:hover {
      background-color: #ffa459;
      transform: translateY(-1px);
    }
    .server-tag {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #607D8B;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">BSL HTTP Web Server</span>
    <h1>404</h1>
    <h2>Resource Not Found</h2>
    <p>The requested route or asset is not registered on this Bonezegei HTTP server endpoint.</p>
    <a href="/" class="btn">Back to Portfolio</a>
    <div class="server-tag">Bonezegei Scripting Language v1.3.3 &bull; CCC181 Lab 1</div>
  </div>
</body>
</html>
